<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SurplusServe emblem">
  <defs>
    <linearGradient id="verd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B6A4E"/>
      <stop offset="1" stop-color="#0F2A1F"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9E3AD"/>
      <stop offset="1" stop-color="#6FA552"/>
    </linearGradient>
    <radialGradient id="grape" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#C0567D"/>
      <stop offset="1" stop-color="#5C1730"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#E6DDC6"/>
    </linearGradient>
    <path id="leafShape" d="M0 0 C18 -42 74 -52 104 -14 C70 18 26 22 0 0 Z"/>
  </defs>

  <!-- verd seal with a fine leaf ring -->
  <circle cx="256" cy="256" r="244" fill="url(#verd)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#8FBF6C" stroke-opacity=".55" stroke-width="5"/>

  <!-- vine stem curling over the bowl -->
  <path d="M150 262 C150 190 206 150 262 150 C318 150 344 118 352 84" fill="none" stroke="url(#leaf)" stroke-width="12" stroke-linecap="round"/>
  <path d="M262 150 C272 128 292 120 312 124" fill="none" stroke="#8FBF6C" stroke-width="5" stroke-linecap="round"/>
  <!-- leaves -->
  <use href="#leafShape" transform="translate(170 214) rotate(-58) scale(1.05)" fill="url(#leaf)"/>
  <use href="#leafShape" transform="translate(232 156) rotate(-12) scale(.9)" fill="#8FBF6C"/>
  <use href="#leafShape" transform="translate(338 104) rotate(-118) scale(.8)" fill="url(#leaf)"/>
  <!-- grape cluster -->
  <g fill="url(#grape)">
    <circle cx="318" cy="170" r="15"/>
    <circle cx="350" cy="170" r="15"/>
    <circle cx="334" cy="196" r="15"/>
    <circle cx="302" cy="196" r="13"/>
    <circle cx="366" cy="196" r="13"/>
    <circle cx="318" cy="221" r="14"/>
    <circle cx="350" cy="221" r="14"/>
    <circle cx="334" cy="245" r="13"/>
  </g>
  <path d="M334 155 C334 144 330 136 324 130" fill="none" stroke="#8FBF6C" stroke-width="5" stroke-linecap="round"/>

  <!-- serving bowl -->
  <rect x="112" y="272" width="288" height="22" rx="11" fill="url(#bowl)"/>
  <path d="M126 294 H386 C380 372 324 414 256 414 C188 414 132 372 126 294 Z" fill="url(#bowl)"/>
  <rect x="210" y="414" width="92" height="16" rx="8" fill="url(#bowl)"/>
  <!-- heart -->
  <path d="M256 384 C236 369 222 357 222 342 C222 330 231 323 241 323 C248 323 253 327 256 333 C259 327 264 323 271 323 C281 323 290 330 290 342 C290 357 276 369 256 384 Z" fill="url(#grape)"/>
</svg>
