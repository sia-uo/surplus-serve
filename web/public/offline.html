<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>Offline — SurplusServe</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at 50% 0%, #16345F 0%, #0B1F3A 60%);
        color: #F8F5EC; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      .card { max-width: 420px; border: 1px solid rgba(201,162,39,.5); border-radius: 20px; padding: 32px 24px; background: rgba(11,31,58,.6); }
      img { width: 96px; height: 96px; }
      h1 { font-family: Georgia, "Times New Roman", serif; color: #C9A227; font-size: 26px; margin: 16px 0 8px; }
      p { line-height: 1.6; opacity: .9; margin: 0 0 6px; }
      .hi { font-size: 15px; opacity: .8; }
      button { margin-top: 20px; background: #B3121F; color: #fff; border: 0; border-radius: 999px; padding: 12px 26px; font-size: 16px; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #C9A227; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.svg" alt="SurplusServe crest" />
      <h1>You are offline</h1>
      <p>SurplusServe needs a connection to show live food listings and pickup OTPs.</p>
      <p class="hi">आप ऑफ़लाइन हैं · તમે ઑફલાઇન છો</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
