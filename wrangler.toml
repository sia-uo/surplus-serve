# SurplusServe — one Worker serves the Hono API (/api/*) and the built React PWA.
name = "surplus-serve"
main = "api/src/index.ts"
compatibility_date = "2025-09-01"

# Production domain. Cloudflare creates the DNS record and certificate on deploy
# (the siak.me zone must be on this Cloudflare account). workers.dev stays on as a fallback.
routes = [{ pattern = "ss.siak.me", custom_domain = true }]
workers_dev = true

# Built frontend (npm run build -> web/dist). Unknown paths fall back to index.html
# so client-side routes work; /api/* always goes to the Worker first.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ---------------------------------------------------------------------------
# D1 database (created in APAC with: npx wrangler d1 create surplus-serve)
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "surplus-serve"
database_id = "e10f05d9-0132-499c-bad3-f200e270e1fa"
migrations_dir = "migrations"

# R2 bucket for NGO certificates, food photos and sponsor logos.
# Create it with:  npx wrangler r2 bucket create surplus-serve-uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "surplus-serve-uploads"

# Every 10 min: expire listings, record no-shows, post recurring listings,
# send batched new-listing alerts. Daily (00:00 IST): housekeeping.
[triggers]
crons = ["*/10 * * * *", "30 18 * * *"]

[observability]
enabled = true

# Non-secret configuration. Secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# RESEND_API_KEY, JWT_SECRET, ADMIN_EMAILS) are set in the Cloudflare dashboard.
[vars]
APP_NAME = "SurplusServe"
# Public URL used in emails sent from cron jobs (no trailing slash).
APP_URL = "https://ss.siak.me"
# Hard cap on packaging cost per serving, in rupees.
PACKAGING_CAP = "15"
# Sender for Resend. Use onboarding@resend.dev until you verify your own domain.
EMAIL_FROM = "SurplusServe <onboarding@resend.dev>"
# Resend free plan allows 100 emails/day; alerts stop early to keep a reserve.
EMAIL_DAILY_LIMIT = "100"
# Your real contact email, sent to OpenStreetMap Nominatim per its usage policy
# (leave empty rather than using a placeholder — placeholders get blocked).
CONTACT_EMAIL = ""
